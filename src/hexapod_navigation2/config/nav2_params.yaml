# ========================================================================
#  Hexapod Navigation2 Optimized Configuration
#  六足机器人自主导航参数配置 —— 专为 "旋转/直行不能同时进行" 优化
#
#  运动模型：全向（横平竖直 + 原地左右旋转），但平移与旋转互斥
#  策略：原地旋转到位 → 连续直行 → 原地旋转到位 → 连续直行
#        尽量保持直行段完整、连续，减少中途旋转打断
# ========================================================================

amcl:
  ros__parameters:
    use_sim_time: False

    # ---------- 运动模型 ----------
    # 六足支持全向平移，选用 OmniMotionModel 匹配 "横平竖直" 特性
    robot_model_type: "nav2_amcl::OmniMotionModel"

    # ---------- 帧定义 ----------
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan

    # ---------- 里程计噪声模型 ----------
    # 六足步态导致里程计噪声较大，适当放宽
    alpha1: 0.3    # 旋转噪声（来自旋转分量）
    alpha2: 0.3    # 旋转噪声（来自平移分量）
    alpha3: 0.3    # 平移噪声（来自平移分量）
    alpha4: 0.3    # 平移噪声（来自旋转分量）
    alpha5: 0.3    # 额外平移噪声（与旋转无关）

    # ---------- 激光模型 ----------
    laser_model_type: "likelihood_field"
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    # ---------- 粒子滤波 ----------
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1

    # ---------- 更新 & 跳束 ----------
    update_min_a: 0.1       # 最小角度变化触发更新 (rad)
    update_min_d: 0.15      # 最小位移触发更新 (m)
    transform_tolerance: 1.0
    tf_broadcast: true
    save_pose_rate: 0.5

    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3


