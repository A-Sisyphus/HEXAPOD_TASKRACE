# ========================================================================
#  Controller Server 控制器服务器
#  ── 核心策略 ──
#  RotationShimController 在路径方向与机器人朝向偏差较大时，
#  先执行 "原地旋转" 到目标方向，再交给 RPP 以纯直线跟随路径。
#  这样直行段不会夹杂旋转，避免底层频繁切换 TRANSLATE/ROTATE 状态。
# ========================================================================
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0

    # ---------- 容差 & 检查器 ----------
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # ---------- 进度检查器 ----------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5       # 在此半径内必须有有效移动
      movement_time_allowance: 10.0        # 允许多长时间内未达到要求仍认为有效（s），放宽以适应六足步态节奏

    # ---------- 目标检查器 (stateful) ----------
    # stateful=True: 先检查 XY 到位，再检查朝向；
    # 六足到达目标 XY 后自动原地旋转到目标朝向，避免直行+旋转混合
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10              # 位置容差 (m)，收紧以提高中途路点精度
      yaw_goal_tolerance: 0.15            # 朝向容差 (rad)  1度=0.0175rad
      stateful: True                       # 分阶段：先位置、后朝向

    # ==================================================================
    #  FollowPath ── RotationShimController + DWB (全向)
    #  RotationShim 负责初始对齐（大角度原地转），
    #  DWB 负责全向路径跟随（可输出 linear.y 横向移动）。
    # ==================================================================
    FollowPath:
      # ---- 外层: RotationShimController ----
      plugin: "nav2_rotation_shim_controller::RotationShimController"

      # 内层主控制器：DWB 全向本地规划
      primary_controller: "dwb_core::DWBLocalPlanner"

      # ---- RotationShim 参数 ----
      angular_dist_threshold: 0.13        # 必须 ≤ yaw_goal_tolerance，否则到点后无法完成最终朝向对齐

      forward_sampling_distance: 0.2       # 向前采样距离 (m)

      rotate_to_heading_angular_vel: 0.06  # 原地旋转角速度 (rad/s)，降速防过冲

      max_angular_accel: 0.3               # 旋转角加速度上限 (rad/s²)，配合降速

      simulate_ahead_time: 1.0             # 模拟前瞻时间 (s)

      # ---- DWB 全向参数 ----
      # 速度范围：允许负向 Y 实现左右横移
      min_vel_x: 0.0
      max_vel_x: 0.06                      # 前向最大速度
      min_vel_y: -0.06                     # 允许左/右全向平移
      max_vel_y: 0.06
      max_vel_theta: 0.06                   # 为最终朝向对齐开放旋转能力；直行段由 critic 权重保证不混入旋转

      min_speed_xy: 0.0
      max_speed_xy: 0.06
      min_speed_theta: 0.0

      # 加速度约束
      acc_lim_x: 2.5
      acc_lim_y: 2.5                       # 横向加速度（非零 = 全向）
      acc_lim_theta: 0.45
      decel_lim_x: -2.5
      decel_lim_y: -2.5
      decel_lim_theta: -0.45

      # 采样密度
      vx_samples: 20
      vy_samples: 10                       # Y 向采样，支持横移
      vtheta_samples: 5                       # 减少旋转采样，避免直行段混入旋转

      # 模拟与粒度
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5

      # 停止判定
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.02         # 低于此即认为"停住"，配合低速运行

      short_circuit_trajectory_evaluation: True
      stateful: True

      # ---- DWB Critics 权重 ----
      # 策略：PathDist+GoalDist 权重远大于 RotateToGoal，直行段旋转轨迹永远选不上
      #       到点后平移 critic 已满足 → RotateToGoal 成为唯一差异项 → 纯旋转对齐
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"

      BaseObstacle.scale: 0.02
      PathAlign.scale: 4.0                    # 进一步降低，减少朝向对齐分量
      PathAlign.forward_point_distance: 0.1
      PathDist.scale: 12.0                    # 大幅提高，纯位置跟踪主导直行
      GoalDist.scale: 6.0                     # 提高，强化直行前进动力
      RotateToGoal.scale: 1.0                 # 压低到最低，直行段无力干扰；到点后唯一差异项驱动旋转
      RotateToGoal.slowing_factor: 3.0        # 更快完成最终对齐
      RotateToGoal.lookahead_time: -1.0


# ========================================================================
#  Planner Server 规划器服务器
#  ── 使用 NavFnPlanner (A*) 网格规划 ──
#  全局路径天然呈横平竖直的网格状，经轻度平滑后保留直角弯，
#  每个直角弯由 RotationShim 触发原地旋转
# ========================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1                      # 目标容差 (m)，与 goal_checker 一致，避免中途点被"掠过"
      use_astar: true                      # A* 算法，效率优于 Dijkstra
      allow_unknown: true                  # 允许经过未知区域


# ========================================================================
#  Smoother Server 路径平滑器
#  ── 轻度平滑 ──
#  仅消除网格锯齿，不做大幅度曲线平滑；
#  保留路径中的直角弯，让 RotationShim 做原地旋转
# ========================================================================
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 500                         # 减少迭代次数，保留棱角
      do_refinement: False                 # 不做二次精化，避免过度平滑


# ========================================================================
#  Behavior Server 行为服务器
# ========================================================================
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.045
    min_rotational_vel: 0.015
    rotational_acc_lim: 0.96


# ========================================================================
#  Local Costmap 局部代价地图
# ========================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true                # 滑动窗口模式

      # 代价地图尺寸 (m)
      width: 1
      height: 1
      resolution: 0.05                    # 5cm 分辨率

      # 机器人轮廓
      robot_radius: 0.10                  # 六足半径约 40cm

      plugins: ["voxel_layer", "inflation_layer"]

      # ---- 体素层 (3D 观测 → 2D 代价) ----
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0

      # ---- 膨胀层 ----
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.10            #膨胀半径

      # ---- 静态层（订阅全局代价地图的静态地图） ----
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      always_send_full_costmap: True


# ========================================================================
#  Global Costmap 全局代价地图
# ========================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.10
      resolution: 0.05
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # ---- 障碍物层 ----
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0

      # ---- 静态层 ----
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # ---- 膨胀层 ----
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.10            #膨胀半径

      always_send_full_costmap: True


# ========================================================================
#  Map Server 地图服务器
# ========================================================================
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True


# ========================================================================
#  Velocity Smoother 速度平滑器
#  ── 将控制器的离散指令平滑为连续的速度曲线 ──
#  对六足尤其重要：防止步态因速度跳变而失稳
# ========================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    # 速度范围 [vx, vy, vtheta]
    max_velocity: [0.07, 0.07, 0.07]    # 线速度匹配 RPP 的 desired_linear_vel
    min_velocity: [-0.07, -0.07, -0.07] # 支持后退 & 反方向

    # 加速度上限
    max_accel: [0.6, 0.6, 0.6]             # 六足加速度不宜过大
    max_decel: [-0.6, -0.6, -0.6]

    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0


# ========================================================================
#  Waypoint Follower 航点跟随器
# ========================================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 3            # 每个路点停靠时间 (秒)


# ========================================================================
#  Robot State Publisher
# ========================================================================
robot_state_publisher:
  ros__parameters:
    use_sim_time: False